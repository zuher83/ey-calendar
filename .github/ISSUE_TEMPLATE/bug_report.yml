name: "Bug report"
description: Report an issue with EyCalendar
title: '[bug]: '
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for taking the time to create a bug report!

        Please search open/closed issues before submitting, as the issue may have already been reported/addressed.

  - type: markdown
    attributes:
      value: |
        #### If you aren't sure this is a bug or not, please open a discussion instead:
        - [Discussions](https://github.com/zuher83/ey-calendar/discussions/new?category=general)

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us how in the description.
      placeholder: Bug description
    validations:
      required: true

  - type: input
    id: components-affected
    attributes:
      label: Affected component/view
      description: Which EyCalendar component or view is affected?
      placeholder: ex. WeekView, EventBar, MonthView...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: A step-by-step description of how to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: codesandbox-stackblitz
    attributes:
      label: CodeSandbox/StackBlitz link
      description: |
        A link to a CodeSandbox or StackBlitz that includes a minimal reproduction of the problem.
        You can fork our playground: https://stackblitz.com/github/zuher83/ey-calendar/tree/main/apps/playground

        > [!CAUTION]
        > If you skip this step and the issue is not easily reproducible, it might be **labeled** with `needs reproduction` and **closed**.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console logs
      description: "Please include browser console logs around the time this bug occurred. Optional if provided reproduction."
      render: bash

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Information about React version, framework (Next.js, Vite, etc.), browsers, and OS.
      render: bash
      placeholder: |
        - React: 18.x / 19.x
        - Framework: Next.js 15 / Vite 5
        - Browser: Chrome 120
        - OS: macOS 14
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this issue, you agree to follow our [Contributing Guidelines](https://github.com/zuher83/ey-calendar/blob/main/CONTRIBUTING.md).
      options:
        - label: I've made research efforts and searched the documentation
          required: true
        - label: I've searched for existing issues
          required: true
