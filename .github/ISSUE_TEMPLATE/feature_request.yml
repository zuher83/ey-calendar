name: "Feature request"
description: Suggest a new feature or enhancement for EyCalendar
title: '[feat]: '
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for taking the time to suggest a new feature!

        Please search open/closed issues and discussions before submitting, as the feature may have already been requested or discussed.

  - type: textarea
    id: feature-description
    attributes:
      label: Describe the feature
      description: A clear and concise description of what you want to happen.
      placeholder: Feature description
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain the use case and why this feature would be useful. What problem does it solve?
      placeholder: |
        As a developer building a scheduling app, I need...
        This would help me...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like this feature to work? Include API examples if applicable.
      placeholder: |
        ```tsx
        <EyCalendar
          newProp={...}
        />
        ```
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I've tried... but...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this feature request, you agree to follow our [Contributing Guidelines](https://github.com/zuher83/ey-calendar/blob/main/CONTRIBUTING.md).
      options:
        - label: I've searched for existing feature requests
          required: true
        - label: I've checked the roadmap and planned features
          required: true
